name: dbt CI

# Validación estática del proyecto dbt (sin conexión a AWS): dbt parse resuelve refs, sources,
# macros y la configuración de los modelos y tests.
# `dbt test` contra Athena queda pendiente de configurar credenciales de AWS para GitHub
# Actions (rol OIDC); hasta entonces los tests de datos se ejecutan en el DAG de Airflow,
# donde un test fallido bloquea los modelos dependientes.

on:
  pull_request:
    paths:
      - "dbt_birds/**"
      - "orchestration/config/profiles.yml"
      - ".github/workflows/dbt_ci.yml"

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    env:
      # Valor ficticio para cualquier env_var('BIRDS_S3_BUCKET'); dbt parse no se conecta a AWS.
      BIRDS_S3_BUCKET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt-athena
        run: pip install dbt-athena-community

      - name: dbt deps
        working-directory: dbt_birds
        run: dbt deps

      # Target `ci` con valores ficticios (orchestration/config/profiles.yml).
      - name: dbt parse
        working-directory: dbt_birds
        run: dbt parse --profiles-dir ../orchestration/config --target ci
