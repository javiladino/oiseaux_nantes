version: 2

models:
  - name: dim_species
    description: "One row per unique taxon observed within the Nantes bounding box. SCD Type 1 — overwritten on each dbt run."
    columns:
      - name: species_key
        description: "Surrogate primary key; equals taxon_id."
        tests:
          - unique
          - not_null
      - name: taxon_id
        description: "iNaturalist taxon identifier."
        tests:
          - unique
          - not_null
      - name: scientific_name
        description: "Latin binomial name of the species."
        tests:
          - not_null
      - name: common_name
        description: "Preferred common name; nullable for uncommon taxa."
      - name: taxon_rank
        description: "Taxonomic rank (e.g., species, subspecies, genus)."
        tests:
          - not_null
      - name: is_threatened
        description: "True when iNaturalist flags the taxon as threatened."
        tests:
          - not_null
      - name: photo_url
        description: >
          Default photo of the taxon on iNaturalist (medium size). In Power BI set its data
          category to "Image URL". Nullable: some taxa have no photo.
        tests:
          - dbt_utils.expression_is_true:
              # A nivel de columna, dbt_utils antepone el nombre de la columna a la expresión.
              expression: "LIKE 'https://%'"
              config:
                severity: warn
      - name: photo_attribution
        description: "Photo credit; must be shown next to the image."
      - name: photo_license
        description: "Photo licence code; null means all rights reserved (filter it out before publishing the report)."
      - name: wikipedia_url
        description: "Wikipedia article of the taxon; in Power BI set its data category to \"Web URL\"."
