version: 2

sources:
  - name: raw_inaturalist
    description: "Raw iNaturalist bird observations ingested by the Lambda pipeline"
    database: awsdatacatalog
    schema: birds_raw
    tables:
      - name: observations
        description: >
          Raw NDJSON observations partitioned by year and month (ingestion run date).
          Created by `dbt run-operation create_raw_observations_table` with Athena
          partition projection (see macros/create_raw_observations_table.sql).
