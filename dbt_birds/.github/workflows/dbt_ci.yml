name: dbt CI

on:
  pull_request:
    paths:
      - "dbt_birds/**"

jobs:
  dbt-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-athena
        run: pip install dbt-athena-community

      - name: Configure profiles.yml
        env:
          DBT_ATHENA_S3_STAGING_DIR: ${{ secrets.DBT_ATHENA_S3_STAGING_DIR }}
          DBT_ATHENA_S3_DATA_DIR: ${{ secrets.DBT_ATHENA_S3_DATA_DIR }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          birds_pipeline:
            target: ci
            outputs:
              ci:
                type: athena
                region_name: eu-west-3
                database: awsdatacatalog
                schema: birds_dbt
                threads: 4
                s3_staging_dir: "${DBT_ATHENA_S3_STAGING_DIR}"
                s3_data_dir: "${DBT_ATHENA_S3_DATA_DIR}"
          EOF

      - name: dbt compile
        working-directory: dbt_birds
        run: dbt compile

      - name: dbt test (modified models)
        working-directory: dbt_birds
        run: dbt test --select state:modified+
